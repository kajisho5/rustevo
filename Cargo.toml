[workspace]
resolver = "2"
members = ["crates/evo-core", "crates/evo-cli", "crates/evo-logic", "apps/pomodoro/logic", "apps/badclock/logic"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
wasmi = { version = "2.0", features = ["deterministic"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
