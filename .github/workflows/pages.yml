name: pages
# Publish the public ledger. `evo site` verifies the ledger first and writes
# nothing if that fails, so a published page was verified by this run.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: pages-ubuntu-24.04-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo build --quiet --release -p evo-cli
      - run: ./target/release/evo site apps/pomodoro --out _site --repo "https://github.com/${{ github.repository }}" --commit "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
